<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhill Reading Room</title>
<style>
:root { --ink: #1d2b36; --paper: #eef3f1; --moss: #3f6b4f; --sun: #e3b23c; }
body { margin: 0; font-family: "Fraunces", Georgia, serif; color: var(--ink); background: var(--paper); line-height: 1.6; }
main { max-width: 68ch; margin: 0 auto; padding: 3rem 1.25rem; }
h1 { font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.05; }
a.cta { display: inline-block; background: var(--moss); color: #fff; padding: .8rem 1.2rem; border-radius: 6px; }
a.cta:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.hero { animation: rise .6s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .hero { animation: none; } }
@media (max-width: 600px) { main { padding: 2rem 1rem; } }
</style></head>
<body><main><section class="hero"><h1>Fernhill Reading Room</h1><p>Books in the old waiting room, open Tuesday to Saturday.</p><a class="cta" href="#start">Become a member</a></section></main></body></html>
