<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hack Week</title>
<style>
:root { --dark: #141413; --light: #faf9f5; --accent: #d97757; --blue: #6a9bcc; --green: #788c5d; --mid: #b0aea5; }
body { font-family: Lora, Georgia, serif; background: var(--light); color: var(--dark); margin: 0 auto; max-width: 40rem; padding: 2rem; }
h1, h2 { font-family: Poppins, Arial, sans-serif; }
h1 { color: var(--accent); }
.card { border-left: 4px solid var(--blue); padding: 0 1rem; }
.note { color: var(--mid); border-top: 1px solid var(--green); }
</style></head>
<body><h1>Hack Week</h1><p>Hack Week runs December 1–5, 2026.</p><div class='card'><h2>Demos</h2><p>Friday at 3pm in the main hall.</p></div><p class='note'>Sign up by November 24.</p></body></html>
